name: kairo_storage
description: "Kairo's SQLite database and the repositories that read and write it."
version: 0.0.1

publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1

  # SQLite, and the ORM chosen in ADR-0003.
  drift: ^2.28.0
  # Ships a current SQLite with the application rather than trusting whatever
  # the operating system happens to provide.
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  kairo_shared_models:
    path: ../kairo_shared_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates kairo_database.g.dart. Run ./scripts/generate.sh after changing a
  # table.
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
