name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS is Kairo's primary platform, and the only one with a Runner today.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Kept in step with .fvmrc. Changing one means changing the other.
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Link local packages
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Build macOS
        run: flutter build macos --debug
        working-directory: apps/desktop
