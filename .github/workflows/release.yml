name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Build and package
        run: ./scripts/package-dmg.sh "${{ inputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cat > notes.md <<'EOF'
          ## Install

          Open the DMG and drag Kairo to Applications.

          This build is ad-hoc signed rather than notarised, so macOS refuses it
          on first launch. Clear the quarantine flag once, after installing:

          ```
          xattr -dr com.apple.quarantine /Applications/Kairo.app
          ```

          Requires macOS 13 or later.
          EOF

          gh release create "v$VERSION" "dist/Kairo-$VERSION.dmg" \
            --title "Kairo $VERSION" \
            --notes-file notes.md
