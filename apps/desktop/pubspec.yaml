name: desktop
description: "Kairo, an offline-first desktop companion for healthier computer habits."
version: 1.0.0+1

publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  kairo_ai:
    path: ../../packages/kairo_ai

  kairo_character_engine:
    path: ../../packages/kairo_character_engine

  kairo_design_system:
    path: ../../packages/kairo_design_system

  kairo_desktop_engine:
    path: ../../packages/kairo_desktop_engine

  kairo_event_bus:
    path: ../../packages/kairo_event_bus

  kairo_reminder_engine:
    path: ../../packages/kairo_reminder_engine

  kairo_scheduler:
    path: ../../packages/kairo_scheduler

  kairo_shared_models:
    path: ../../packages/kairo_shared_models

  kairo_storage:
    path: ../../packages/kairo_storage

  kairo_workflow_engine:
    path: ../../packages/kairo_workflow_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
